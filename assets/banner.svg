<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d"><title id="t">Nihir Soni</title><desc id="d">Banner: a damaged sepia scan of a clock tower photograph is restored to clean cyan as a scan line sweeps across.</desc><defs>
