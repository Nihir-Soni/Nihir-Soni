<filter id="wblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="half"><rect x="0" y="0" width="116" height="270"/></clipPath><clipPath id="halfR"><rect x="116" y="0" width="144" height="270"/></clipPath><linearGradient id="conf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A36A"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="880" height="290" rx="18" fill="#0F172A"/><rect x=".5" y=".5" width="879" height="289" rx="18" fill="none" stroke="#164E63"/><text x="40" y="84" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="44" font-weight="500" letter-spacing="-.5" fill="#E8EEF2">TIMEKEEPER</text><text x="40" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94A3B8">Restores and colorizes damaged historical</text><text x="40" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94A3B8">photographs, and calibrates how far to trust</text><text x="40" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94A3B8">each result. Capstone project built with a team</text><text x="40" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94A3B8">at Samsung Innovation Campus.</text><rect x="40" y="226" width="135" height="28" rx="14.0" fill="#22D3EE" fill-opacity=".09" stroke="#22D3EE" stroke-opacity=".35"/><text x="107.5" y="244.725" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#E8EEF2">Computer vision</text><rect x="185" y="226" width="120" height="28" rx="14.0" fill="#22D3EE" fill-opacity=".09" stroke="#22D3EE" stroke-opacity=".35"/><text x="245.0" y="244.725" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#E8EEF2">Deep learning</text>