<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="t d"><title id="t">TIMEKEEPER</title><desc id="d">Card for TIMEKEEPER: a photograph split between its damaged scan and restored version, with a confidence scale.</desc><defs>
<linearGradient id="wskyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3A52"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
