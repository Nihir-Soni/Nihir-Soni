
name: Generate 3D Contribution Graph

on:
  schedule:
    # Daily at 18:00 UTC (11:30 PM in India)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    name: Generate profile contribution graphic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to the contribution graphics."
            exit 0
          fi

          git commit -m "chore: update 3D contribution graph"
          git push
